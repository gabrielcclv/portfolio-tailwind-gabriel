<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gabriel Calvo  | Portfolio Template 2026</title>
		<meta name="description" content="Plantilla de portfolio profesional construida con Tailwind CSS y Vite.">

		<meta property="og:type" content="website">
		<meta property="og:title" content="Gabriel Calvo - Portfolio">
		<meta property="og:description" content="Explora mis proyectos y habilidades en esta plantilla de alto rendimiento.">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Gabriel Calvo - Portfolio">
		<link rel="stylesheet" href="./src/styles/index.css" />
		<script type="module" src="./src/main.js"></script>
	</head>
	<body class="bg-background text-foreground">
		<a
			href="#app"
			class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-primary text-primary-foreground px-4 py-2 rounded">
			Saltar al contenido principal
		</a>

		<!-- Minimal Navigation -->
		<nav
			id="navbar"
			class="fixed top-0 left-0 w-full bg-card text-card-foreground border-b border-border transition-all duration-300"
			style="background-color: var(--color-card); z-index: 9999; position: fixed"
			role="navigation"
			aria-label="Navegación principal">
			<div class="max-w-7xl mx-auto px-4">
				<div class="flex justify-between items-center h-16">
					<!-- Logo -->
					<a href="#/" class="text-xl font-semibold hover:opacity-70 transition-opacity" aria-label="Inicio">Portfolio</a>

					<!-- Right side: Theme toggle + Menu button -->
					<div class="flex items-center gap-3">
						<!-- Theme toggle (always visible) -->
						<button
							type="button"
							id="theme-toggle"
							class="p-2 rounded-md hover:bg-muted/50 transition-colors"
							aria-pressed="false"
							aria-label="Cambiar tema"></button>

						<!-- Hamburger Menu Button -->
						<button
							type="button"
							id="mobile-menu-btn"
							class="p-2 rounded-md hover:bg-muted/50 transition-colors"
							aria-label="Toggle menu"
							aria-expanded="false">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
							</svg>
						</button>
					</div>
				</div>
			</div>

			<!-- Overlay when menu is open -->
			<div id="menu-overlay" class="hidden fixed inset-0 bg-black/50" style="z-index: 9997; top: 4rem" aria-hidden="true"></div>

			<!-- Slide-out Menu -->
			<div id="mobile-menu" class="hidden fixed top-16 right-0 w-80 max-w-[85vw] h-[calc(100vh-4rem)] bg-card border-l border-border overflow-y-auto shadow-2xl" style="z-index: 9998" aria-hidden="true" role="dialog" aria-modal="true">
				<nav class="p-4" role="navigation" aria-label="Menu de navegación">
					<ul class="space-y-1">
						<!-- Home with nested sections -->
						<li><a href="#/" class="block px-3 py-2.5 text-sm font-medium hover:bg-muted/50 rounded-md transition-colors">Inicio</a></li>
						<li><a href="#/about" class="block px-3 py-2.5 text-sm font-medium hover:bg-muted/50 rounded-md transition-colors">Acerca de</a></li>
						<li><a href="#/projects" class="block px-3 py-2.5 text-sm font-medium hover:bg-muted/50 rounded-md transition-colors">Proyectos</a></li>
						<li><a href="#/contact" class="block px-3 py-2.5 text-sm font-medium hover:bg-muted/50 rounded-md transition-colors">Contacto</a></li>
					</ul>
				</nav>
			</div>
		</nav>

		<!-- Área de contenido principal -->
		<main id="app" class="min-h-screen mt-16 mb-40" role="main">
			<!-- Las plantillas de vistas son externas en ./src/views/*.html y son cargadas de forma lazy por el router. -->
		</main>

		<!-- Pie de página compartido -->
		<footer
			class="w-full bg-card text-card-foreground py-8 border-t border-border"
			role="contentinfo">
			<div class="container mx-auto px-4 text-center">
				<p class="text-lg">&copy; 2025 Portfolio SPA. Construido con Tailwind y Vanilla JS.</p>
			</div>
		</footer>

		<!-- Mobile Menu Handler - Simple and Direct -->
		<script>
			console.log('📱 Mobile menu script starting');
			
			const mobileBtn = document.getElementById('mobile-menu-btn');
			const mobileMenu = document.getElementById('mobile-menu');
			const overlay = document.getElementById('menu-overlay');

			if (!mobileBtn) console.error('mobile-menu-btn not found');
			if (!mobileMenu) console.error('mobile-menu not found');
			if (!overlay) console.error('menu-overlay not found');

			if (mobileBtn && mobileMenu && overlay) {
				console.log('All menu elements found');

				// Toggle menu function
				function toggleMenu() {
					const isHidden = mobileMenu.classList.contains('hidden');
					console.log('Toggle menu - currently hidden:', isHidden);
					
					if (isHidden) {
						mobileMenu.classList.remove('hidden');
						overlay.classList.remove('hidden');
						mobileBtn.setAttribute('aria-expanded', 'true');
						console.log('Menu opened');
					} else {
						mobileMenu.classList.add('hidden');
						overlay.classList.add('hidden');
						mobileBtn.setAttribute('aria-expanded', 'false');
						console.log('Menu closed');
					}
				}

				// Button click handler
				mobileBtn.addEventListener('click', function(e) {
					console.log('Button clicked');
					e.preventDefault();
					e.stopImmediatePropagation();
					toggleMenu();
				}, { capture: false, once: false });

				// Overlay click to close
				overlay.addEventListener('click', function(e) {
					console.log('Overlay clicked');
					e.preventDefault();
					e.stopImmediatePropagation();
					mobileMenu.classList.add('hidden');
					overlay.classList.add('hidden');
					mobileBtn.setAttribute('aria-expanded', 'false');
				}, { capture: false, once: false });

				// Close menu when clicking links
				mobileMenu.addEventListener('click', function(e) {
					if (e.target.closest('a[href^="#/"]')) {
						console.log('Router link clicked, closing menu');
						mobileMenu.classList.add('hidden');
						overlay.classList.add('hidden');
						mobileBtn.setAttribute('aria-expanded', 'false');
					}
				}, { capture: false, once: false });

				// Escape key
				document.addEventListener('keydown', function(e) {
					if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
						console.log('⌨️ Escape pressed, closing menu');
						mobileMenu.classList.add('hidden');
						overlay.classList.add('hidden');
						mobileBtn.setAttribute('aria-expanded', 'false');
					}
				}, { capture: false, once: false });

				console.log('Mobile menu handlers registered');
			}
		</script>
	</body>
</html>
